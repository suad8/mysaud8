services:
  db:
    image: postgres:16-alpine
    container_name: mysaud8-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mysaud8
      POSTGRES_PASSWORD: mysaud8_dev
      POSTGRES_DB: mysaud8
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysaud8"]
      interval: 5s
      timeout: 5s
      retries: 10

  # تخزين الصور محلياً بواجهة متوافقة مع S3
  storage:
    image: minio/minio:latest
    container_name: mysaud8-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mysaud8
      MINIO_ROOT_PASSWORD: mysaud8_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
